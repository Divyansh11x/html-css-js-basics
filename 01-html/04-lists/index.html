<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>

    <h1>Ordered List</h1>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
    </ol>

    <hr>

    <h1>Unordered List</h1>

    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>

    <hr>

    <h1>Description List</h1>

    <dl>
        <dt>HTML</dt>
        <dd>Used to create webpage structure.</dd>

        <dt>CSS</dt>
        <dd>Used for styling web pages.</dd>

        <dt>JavaScript</dt>
        <dd>Used to add interactivity.</dd>
    </dl>

</body>
</html>
