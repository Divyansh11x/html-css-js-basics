<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
</head>
<body>

    <h1>Google Map</h1>

    <iframe
        src="https://www.google.com/maps?q=Delhi&output=embed"
        width="600"
        height="450">
    </iframe>

    <hr>

    <h1>Wikipedia</h1>

    <iframe
        src="https://en.wikipedia.org/wiki/HTML"
        width="700"
        height="400">
    </iframe>

</body>
</html>
