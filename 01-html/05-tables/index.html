<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>

</head>
<body>

    <h1>Student Table</h1>

    <table>

        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
            <th>Semester</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>BCA</td>
            <td>6</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>BCA</td>
            <td>6</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Aman</td>
            <td>BCA</td>
            <td>6</td>
        </tr>

        <tr>
            <td>104</td>
            <td>Neha</td>
            <td>BCA</td>
            <td>6</td>
        </tr>

    </table>

</body>
</html>
