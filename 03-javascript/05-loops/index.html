<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loops</title>
</head>
<body>

<h1>JavaScript Loops</h1>

<script>

document.write("<h2>For Loop</h2>");

for(let i=1;i<=5;i++){

    document.write(i + "<br>");

}

document.write("<hr>");

document.write("<h2>While Loop</h2>");

let j=1;

while(j<=5){

    document.write(j + "<br>");

    j++;

}

document.write("<hr>");

document.write("<h2>Do While Loop</h2>");

let k=1;

do{

    document.write(k + "<br>");

    k++;

}
while(k<=5);

</script>

</body>
</html>
