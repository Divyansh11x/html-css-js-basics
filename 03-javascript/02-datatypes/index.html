<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Data Types</title>
</head>

<body>

    <h1>JavaScript Data Types</h1>

    <script>

        let student = "Divyansh";
        let age = 21;
        let percentage = 69.43;
        let passed = true;
        let city = null;
        let phone;
        let skills = ["HTML", "CSS", "JavaScript"];
        let person = {
            name: "Divyansh",
            course: "BCA"
        };

        document.write("<b>String :</b> " + student + "<br>");
        document.write("<b>Number :</b> " + age + "<br>");
        document.write("<b>Float :</b> " + percentage + "<br>");
        document.write("<b>Boolean :</b> " + passed + "<br>");
        document.write("<b>Null :</b> " + city + "<br>");
        document.write("<b>Undefined :</b> " + phone + "<br>");
        document.write("<b>Array :</b> " + skills + "<br>");
        document.write("<b>Object :</b> " + person.name);

    </script>

</body>

</html>
