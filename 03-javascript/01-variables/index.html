<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variables</title>
</head>

<body>

    <h1>JavaScript Variables</h1>

    <script>

        // var
        var name = "Divyansh";
        document.write("<h3>var : " + name + "</h3>");

        // let
        let age = 21;
        document.write("<h3>let : " + age + "</h3>");

        // const
        const country = "India";
        document.write("<h3>const : " + country + "</h3>");

        // Variable can be changed
        age = 22;

        document.write("<h3>Updated Age : " + age + "</h3>");

    </script>

</body>

</html>
