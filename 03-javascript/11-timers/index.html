<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Timers</title>

<style>

body{

font-family:Arial;
text-align:center;

}

button{

padding:10px 20px;
margin:10px;

}

</style>

</head>
<body>

<h1 id="time"></h1>

<button onclick="startClock()">
Start Clock
</button>

<script>

function startClock(){

setInterval(function(){

let now = new Date();

document.getElementById("time").innerHTML =
now.toLocaleTimeString();

},1000);

}

</script>

</body>
</html>
