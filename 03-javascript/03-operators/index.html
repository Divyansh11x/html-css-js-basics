<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Operators</title>
</head>
<body>

<h1>Operators</h1>

<script>

let a = 20;
let b = 10;

document.write("<h3>Arithmetic Operators</h3>");

document.write("Addition = " + (a+b) + "<br>");
document.write("Subtraction = " + (a-b) + "<br>");
document.write("Multiplication = " + (a*b) + "<br>");
document.write("Division = " + (a/b) + "<br>");
document.write("Modulus = " + (a%b) + "<br>");

document.write("<hr>");

document.write("<h3>Comparison Operators</h3>");

document.write(a>b);
document.write("<br>");
document.write(a<b);
document.write("<br>");
document.write(a==b);
document.write("<br>");
document.write(a!=b);

document.write("<hr>");

document.write("<h3>Logical Operators</h3>");

document.write((a>b && b<20));
document.write("<br>");
document.write((a<5 || b<20));
document.write("<br>");
document.write(!(a==b));

</script>

</body>
</html>
