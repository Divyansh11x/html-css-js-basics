<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Colors</title>

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
}

h1{
    color:blue;
}

.rgb{
    color:rgb(255,0,0);
}

.hex{
    color:#00aa55;
}

.hsl{
    color:hsl(280,100%,40%);
}

.box{
    width:300px;
    padding:20px;
    background:orange;
    color:white;
    margin-top:20px;
}

</style>

</head>
<body>

<h1>CSS Colors</h1>

<p class="rgb">RGB Color</p>

<p class="hex">HEX Color</p>

<p class="hsl">HSL Color</p>

<div class="box">
    Background Color Example
</div>

</body>
</html>
