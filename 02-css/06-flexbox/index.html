<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Flexbox</title>

<style>

body{
    font-family:Arial,sans-serif;
}

.container{

    display:flex;

    justify-content:space-around;

    align-items:center;

    flex-wrap:wrap;

    gap:20px;

    height:300px;

    border:2px solid black;

}

.box{

    width:120px;

    height:120px;

    background:steelblue;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:24px;

    border-radius:10px;

}

</style>

</head>
<body>

<h1>CSS Flexbox</h1>

<div class="container">

    <div class="box">1</div>

    <div class="box">2</div>

    <div class="box">3</div>

    <div class="box">4</div>

    <div class="box">5</div>

</div>

</body>
</html>
