<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>

        /* Universal Selector */
        *{
            font-family: Arial, sans-serif;
        }

        /* Element Selector */
        h1{
            color: blue;
        }

        /* Class Selector */
        .info{
            color: green;
            font-size:20px;
        }

        /* ID Selector */
        #special{
            color:red;
            font-weight:bold;
        }

        /* Group Selector */
        h2,p{
            margin:10px;
        }

    </style>

</head>
<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p>This paragraph is selected using element selector.</p>

    <p class="info">
        This paragraph uses class selector.
    </p>

    <p id="special">
        This paragraph uses ID selector.
    </p>

</body>
</html>
