<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Box Model</title>

<style>

.box{

    width:300px;

    padding:20px;

    border:5px solid blue;

    margin:40px;

    background:lightyellow;

}

</style>

</head>
<body>

<h1>CSS Box Model</h1>

<div class="box">

    <h2>Box Model</h2>

    <p>
        Every HTML element is considered as a box.
    </p>

    <p>
        Box Model consists of:
    </p>

    <ul>

        <li>Content</li>

        <li>Padding</li>

        <li>Border</li>

        <li>Margin</li>

    </ul>

</div>

</body>
</html>
