<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Display</title>

<style>

.block{

    display:block;

    background:skyblue;

    margin:10px;

    padding:10px;

}

.inline{

    display:inline;

    background:yellow;

}

.inline-block{

    display:inline-block;

    width:120px;

    height:80px;

    background:orange;

    margin:10px;

    text-align:center;

    line-height:80px;

}

.none{

    display:none;

}

</style>

</head>
<body>

<h1>Display Property</h1>

<div class="block">Block Element</div>

<span class="inline">Inline Element</span>

<span class="inline">Inline Element</span>

<br><br>

<div class="inline-block">Box 1</div>

<div class="inline-block">Box 2</div>

<div class="inline-block">Box 3</div>

<p class="none">
This paragraph is hidden.
</p>

</body>
</html>
