<!DOCTYPE html>
<html>

<head>
    <title>Todo App</title>
</head>

<body>

    <h1>Todo App</h1>

    <input id="task">

    <button onclick="addTask()">
        Add
    </button>

    <ul id="list"></ul>

    <script>

        function addTask() {

            let task =
                document.getElementById("task").value;

            let li =
                document.createElement("li");

            li.innerHTML = task;

            document.getElementById("list").appendChild(li);

            document.getElementById("task").value = "";

        }

    </script>

</body>

</html>
