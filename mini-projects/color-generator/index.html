<!DOCTYPE html>
<html>
<head>
<title>Color Generator</title>
</head>

<body>

<h1>Background Color Generator</h1>

<button onclick="changeColor()">
Generate Color
</button>

<script>

function changeColor(){

let color =
"#"+Math.floor(Math.random()*16777215).toString(16);

document.body.style.backgroundColor=color;

}

</script>

</body>
</html>
